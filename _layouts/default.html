<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
</head>
<body>
  <div class="bg-atmosphere" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-wordmark">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.url == '/about/' %} is-active{% endif %}">About</a>
      <a href="{{ '/resume/' | relative_url }}" class="nav-link{% if page.url == '/resume/' %} is-active{% endif %}">Resume</a>
      <a href="https://github.com/{{ site.author.github }}" class="nav-link nav-link--external" target="_blank" rel="noopener noreferrer">GitHub&thinsp;↗</a>
    </nav>
  </header>

  <main class="site-main" id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span class="footer-meta">© {{ site.time | date: "%Y" }} {{ site.author.name }}{% if site.data.pii.last_name != "" %} {{ site.data.pii.last_name }}{% endif %}</span>
    <span class="footer-dot" aria-hidden="true">·</span>
    <a href="{{ '/feed.xml' | relative_url }}" class="footer-link">RSS</a>
  </footer>

  <script src="{{ '/assets/js/cursor.js' | relative_url }}" defer></script>
</body>
</html>
