---
layout: default
---
<section class="home">
  <p class="home-eyebrow">{{ site.author.tagline }}</p>
  <h1 class="home-name">
    <span class="home-name__first">{{ site.author.name }}</span>
    {% if site.data.pii.last_name != "" %}<em class="home-name__last">{{ site.data.pii.last_name }}</em>{% endif %}
  </h1>
  <div class="home-rule" aria-hidden="true"></div>
  <p class="home-intro">{{ content | strip_html | strip }}</p>
  <nav class="home-links" aria-label="Site sections">
    <a href="{{ '/about/' | relative_url }}" class="home-btn home-btn--primary">About me</a>
    <a href="{{ '/resume/' | relative_url }}" class="home-btn">Resume</a>
    <a href="https://github.com/{{ site.author.github }}" class="home-btn" target="_blank" rel="noopener noreferrer">GitHub&thinsp;↗</a>
  </nav>
</section>
